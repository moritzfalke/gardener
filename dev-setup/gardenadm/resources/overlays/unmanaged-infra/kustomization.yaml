apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

sortOptions:
  order: fifo

resources:
- ../../base

patches:
- path: patch-shoot.yaml
# TODO(acumino): Remove once the garden cluster runs with HA etcd, which
# allows the update to proceed on worker nodes even when one virtual etcd replica is temporarily unavailable.
- target:
    group: core.gardener.cloud
    version: v1beta1
    kind: Shoot
    name: root
    namespace: garden
  patch: |-
    - op: add
      path: /spec/provider/workers/1/kubernetes/version
      value: "1.36.0"
# Remove the provider-local Extension so the unmanaged-infra scenario omits it from the generated manifests.
- target:
    group: operator.gardener.cloud
    version: v1alpha1
    kind: Extension
    name: provider-local
  patch: |-
    $patch: delete
    apiVersion: operator.gardener.cloud/v1alpha1
    kind: Extension
    metadata:
      name: provider-local
- target:
    group: core.gardener.cloud
    version: v1beta1
    kind: Shoot
    name: root
  patch: |-
    - op: remove
      path: /spec/provider/type
